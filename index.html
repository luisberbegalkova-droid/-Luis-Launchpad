<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-surface-variant": "var(--on-surface-variant)",
                "primary-container": "var(--primary-container)",
                "on-primary-container": "var(--on-primary-container)",
                "background": "var(--bg-color)",
                "surface-container-low": "var(--surface-container-low)",
                "secondary": "var(--secondary)",
                "on-surface": "var(--text-color)",
                "surface": "var(--surface-color)",
                "primary": "var(--primary-color)",
                "surface-container-lowest": "var(--surface-container-lowest)"
              },
              spacing: {
                "unit": "8px",
                "container-max": "1280px",
                "gutter": "24px",
                "margin-desktop": "48px",
                "margin-mobile": "16px"
              },
              fontFamily: {
                "headline-lg": ["Anybody"],
                "label-sm": ["JetBrains Mono"],
                "body-md": ["Work Sans"],
                "headline-lg-mobile": ["Anybody"],
                "title-md": ["Work Sans"],
                "display-lg": ["Anybody"]
              },
              fontSize: {
                "headline-lg": ["40px", {"lineHeight": "1.2", "fontWeight": "800"}],
                "label-sm": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500"}],
                "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "800"}],
                "title-md": ["20px", {"lineHeight": "1.5", "fontWeight": "600"}],
                "display-lg": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "900"}]
              }
            },
          },
        }
    </script>
    <style id="skinStyles">
        /* Las variables dinámicas se manejan aquí por inyección de JavaScript */
    </style>
    <style>
        .electric-shadow { box-shadow: var(--electric-shadow-val); }
        .electric-shadow-hover { box-shadow: var(--electric-shadow-hover-val); }
        .soft-border { border: 2px solid rgba(0,0,0,0.05); }
        .bg-pattern {
            background-color: var(--bg-color);
            background-image: var(--radial-pattern);
            background-size: 32px 32px;
            transition: background-color 0.6s ease;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 48;
        }
        .font-bubbly { font-family: 'Anybody', sans-serif; }
        
        /* Animaciones y transiciones de UI */
        .dropdown-menu {
            transform: translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
        }
        .dropdown-menu.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col font-bubbly text-on-background">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center px-4 bg-pattern backdrop-blur-md">
    <div class="w-full max-w-md bg-surface border-4 border-primary rounded-2xl p-10 flex flex-col gap-6 electric-shadow">
        <div class="text-center">
            <h1 class="text-headline-lg-mobile font-black tracking-tight text-primary uppercase">LAUNCHPAD</h1>
            <p class="font-label-sm text-[11px] opacity-60 mt-1 uppercase tracking-widest">GATEWAY // SYSTEM VERIFICATION</p>
        </div>
        
        <div class="flex flex-col gap-4 font-body-md">
            <div>
                <label class="block font-label-sm text-xs uppercase tracking-wide text-primary font-bold mb-2">user_identity</label>
                <input id="usernameInput" type="text" class="w-full h-12 bg-surface-container-low border-2 border-primary/20 rounded-2xl px-6 font-label-sm focus:ring-4 focus:ring-primary/20 transition-all text-on-surface" placeholder="USER ID">
            </div>
            <div>
                <label class="block font-label-sm text-xs uppercase tracking-wide text-primary font-bold mb-2">access_key</label>
                <input id="passwordInput" type="password" class="w-full h-12 bg-surface-container-low border-2 border-primary/20 rounded-2xl px-6 font-label-sm focus:ring-4 focus:ring-primary/20 transition-all text-on-surface" placeholder="••••••••">
            </div>
            <div id="loginError" class="hidden font-label-sm text-[11px] text-red-600 font-bold uppercase bg-red-100 border-2 border-red-200 rounded-2xl px-4 py-3 text-center">
                Autenticación Errónea. Verifique terminal.
            </div>
        </div>

        <button onclick="handleLogin()" class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-sm uppercase rounded-2xl font-bold transition-all shadow-lg active:scale-95 hover:opacity-90">
            Initialize_
        </button>
    </div>
</div>

<div id="mainContent" class="hidden flex-grow flex flex-col">
    <nav class="w-full top-4 sticky bg-surface/80 backdrop-blur-md rounded-2xl mx-auto max-w-[calc(100%-2*theme(spacing.gutter))] border-none electric-shadow z-50 transition-all duration-300">
        <div class="flex justify-between items-center px-gutter py-unit h-20">
            <div id="logoTitle" class="font-headline-lg-mobile text-headline-lg-mobile font-black tracking-tight text-primary uppercase cursor-pointer transition-transform hover:scale-105 active:scale-95">
                LaunchPad
            </div>
            
            <div class="hidden md:flex flex-1 max-w-xl mx-8 relative items-center">
                <input id="searchInput" oninput="filterApps()" class="w-full h-12 rounded-2xl border-none bg-surface-container-low px-6 font-label-sm text-label-sm electric-shadow focus:ring-4 focus:ring-primary/20 transition-all text-on-surface" placeholder="EXPLORE SOMETHING NEW..." type="text"/>
                <button class="absolute right-2 bg-gradient-to-r from-primary to-primary-container text-on-primary h-8 px-5 rounded-xl font-label-sm uppercase hover:opacity-90 active:scale-95 transition-all shadow-lg">
                    Search
                </button>
            </div>
            
            <div class="flex items-center gap-4 relative">
                <div class="relative">
                    <button onclick="toggleSkinMenu(event)" class="cursor-pointer transition-all duration-200 hover:bg-primary-container/20 rounded-2xl p-2 flex items-center">
                        <span class="material-symbols-outlined block text-primary">palette</span>
                    </button>
                    <div id="skinDropdown" class="dropdown-menu absolute right-0 mt-4 w-60 bg-surface border-2 border-primary/20 rounded-2xl p-2 z-[60] flex flex-col gap-1 font-label-sm text-xs text-on-surface">
                        <button onclick="selectSkin('emerald')" id="opt-emerald" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Emerald Aurora</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('sunset')" id="opt-sunset" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Sunset Quartz</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('cyberpunk')" id="opt-cyberpunk" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Obsidian Neon</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('nordic')" id="opt-nordic" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Nordic Frost</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('velvet')" id="opt-velvet" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Midnight Velvet</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('tokyo')" id="opt-tokyo" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Tokyo Tech</span><span class="dot hidden">•</span></button>
                    </div>
                </div>

                <div id="userDisplay" class="font-label-sm text-xs font-bold text-primary bg-primary-container/20 px-3 py-2 rounded-xl uppercase">SYS: --</div>
                
                <button onclick="handleLogout()" class="cursor-pointer transition-all duration-200 hover:bg-red-100 rounded-2xl p-2" title="Cerrar Sesión">
                    <span class="material-symbols-outlined block text-red-600">logout</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-margin-mobile md:px-margin-desktop py-12">
        <div class="md:hidden mb-12">
            <div class="flex items-center gap-3">
                <input id="searchInputMobile" oninput="syncAndFilter(this)" class="flex-grow h-14 rounded-2xl border-none bg-surface px-6 font-label-sm electric-shadow focus:ring-4 focus:ring-primary/20 text-on-surface" placeholder="SEARCH" type="text"/>
                <button class="bg-primary text-on-primary h-14 w-14 rounded-2xl electric-shadow flex items-center justify-center">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </div>
        </div>

        <div id="appGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-10">
            </div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-primary/40 font-bold">
            <span class="material-symbols-outlined text-6xl mb-4">folder_open</span>
            <p class="uppercase tracking-widest text-sm">No apps found</p>
        </div>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 rounded-[2rem] bg-surface/90 backdrop-blur-xl border-none electric-shadow flex items-center gap-4 px-6 py-3 w-max z-50 transition-all">
        <div id="navigationDock" class="flex gap-4 items-center">
            </div>
    </nav>

    <footer class="w-full mt-auto bg-surface-container-lowest/50 backdrop-blur-sm">
        <div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop py-10 w-full gap-6">
            <div id="footerTitle" class="font-headline-lg-mobile text-headline-lg-mobile text-primary/40 uppercase font-black tracking-tighter">
                LaunchPad <span class="text-[14px] align-top text-primary/20">v2.0</span>
            </div>
            <div class="flex gap-8 font-label-sm text-[11px] font-bold uppercase tracking-widest text-on-surface-variant/60">
                <a class="hover:text-primary transition-colors" href="#">Privacy</a>
                <a class="hover:text-primary transition-colors" href="#">Terms</a>
                <a class="hover:text-primary transition-colors" href="#">API</a>
                <a class="hover:text-primary transition-colors" href="#">Status</a>
            </div>
            <div id="footerCopyright" class="font-label-sm text-[11px] text-on-surface-variant/40 font-bold uppercase tracking-tight">
                © 2026 LaunchPad Electric Pop.
            </div>
        </div>
    </footer>
</div>

<script>
    // Repositorio de 6 Skins adaptado al nuevo sistema Material Pop
    const skins = {
        emerald: {
            title: "LaunchPad Aurora",
            copyright: "© 2026 Emerald Aurora Edition.",
            variables: {
                "--bg-color": "#f0fdf4",
                "--text-color": "#064e3b",
                "--primary-color": "#065f46",
                "--primary-container": "#a7f3d0",
                "--on-primary-container": "#042f22",
                "--surface-color": "#ffffff",
                "--surface-container-low": "#ecfdf5",
                "--surface-container-lowest": "#ffffff",
                "--on-surface-variant": "#3f4943",
                "--secondary": "#4b6355",
                "--radial-pattern": "radial-gradient(rgba(6, 95, 70, 0.15) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 30px -5px rgba(6, 95, 70, 0.15)",
                "--electric-shadow-hover-val": "0 25px 40px -10px rgba(6, 95, 70, 0.3)",
                "--card-gradient": "linear-gradient(135deg, #34d399 0%, #065f46 100%)",
                "--tab-glow": "0 0 12px rgba(6, 95, 70, 0.3)"
            }
        },
        sunset: {
            title: "LaunchPad Crystal",
            copyright: "© 2026 Sunset Quartz Framework.",
            variables: {
                "--bg-color": "#fff5f2",
                "--text-color": "#6b4e71",
                "--primary-color": "#ff7e67",
                "--primary-container": "rgba(255, 240, 230, 0.9)",
                "--on-primary-container": "#4a2834",
                "--surface-color": "#ffffff",
                "--surface-container-low": "#fff0ea",
                "--surface-container-lowest": "#ffffff",
                "--on-surface-variant": "#6b4e71",
                "--secondary": "#8b5d6b",
                "--radial-pattern": "radial-gradient(rgba(255, 126, 103, 0.2) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 30px -5px rgba(255, 126, 103, 0.2)",
                "--electric-shadow-hover-val": "0 25px 40px -10px rgba(255, 126, 103, 0.4)",
                "--card-gradient": "linear-gradient(135deg, #ffd06f 0%, #ff7e67 100%)",
                "--tab-glow": "0 0 12px rgba(255, 126, 103, 0.4)"
            }
        },
        cyberpunk: {
            title: "LaunchPad Obsidian",
            copyright: "© 2026 Cyberpunk Synth Terminal.",
            variables: {
                "--bg-color": "#09090e",
                "--text-color": "#00f2fe",
                "--primary-color": "#00f2fe",
                "--primary-container": "rgba(0, 242, 254, 0.15)",
                "--on-primary-container": "#ffffff",
                "--surface-color": "#11111d",
                "--surface-container-low": "#06060a",
                "--surface-container-lowest": "#000000",
                "--on-surface-variant": "#9b51e0",
                "--secondary": "#7b2cbf",
                "--radial-pattern": "radial-gradient(rgba(0, 242, 254, 0.25) 1.2px, transparent 1.2px)",
                "--electric-shadow-val": "0 15px 30px -5px rgba(0, 242, 254, 0.3)",
                "--electric-shadow-hover-val": "0 25px 40px -10px rgba(0, 242, 254, 0.6)",
                "--card-gradient": "linear-gradient(135deg, #9b51e0 0%, #00f2fe 100%)",
                "--tab-glow": "0 0 15px rgba(0, 242, 254, 0.7)"
            }
        },
        nordic: {
            title: "LaunchPad Frost",
            copyright: "© 2026 Nordic Matrix Spaces.",
            variables: {
                "--bg-color": "#f8fafc",
                "--text-color": "#334155",
                "--primary-color": "#475569",
                "--primary-container": "#e2e8f0",
                "--on-primary-container": "#0f172a",
                "--surface-color": "#ffffff",
                "--surface-container-low": "#f1f5f9",
                "--surface-container-lowest": "#ffffff",
                "--on-surface-variant": "#64748b",
                "--secondary": "#475569",
                "--radial-pattern": "radial-gradient(rgba(71, 85, 105, 0.15) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 30px -5px rgba(71, 85, 105, 0.08)",
                "--electric-shadow-hover-val": "0 25px 40px -10px rgba(71, 85, 105, 0.2)",
                "--card-gradient": "linear-gradient(135deg, #cbd5e1 0%, #475569 100%)",
                "--tab-glow": "0 0 10px rgba(71, 85, 105, 0.2)"
            }
        },
        velvet: {
            title: "LaunchPad Velvet",
            copyright: "© 2026 Midnight Lounge Suite.",
            variables: {
                "--bg-color": "#070412",
                "--text-color": "#e0aaff",
                "--primary-color": "#7b2cbf",
                "--primary-container": "rgba(123, 44, 191, 0.2)",
                "--on-primary-container": "#ffffff",
                "--surface-color": "#120d24",
                "--surface-container-low": "#0a0518",
                "--surface-container-lowest": "#030107",
                "--on-surface-variant": "#ff9e00",
                "--secondary": "#9d4edd",
                "--radial-pattern": "radial-gradient(rgba(123, 44, 191, 0.3) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 30px -5px rgba(123, 44, 191, 0.4)",
                "--electric-shadow-hover-val": "0 25px 40px -10px rgba(123, 44, 191, 0.7)",
                "--card-gradient": "linear-gradient(135deg, #ff9e00 0%, #7b2cbf 100%)",
                "--tab-glow": "0 0 15px rgba(123, 44, 191, 0.6)"
            }
        },
        tokyo: {
            title: "LaunchPad Tokyo",
            copyright: "© 2026 Tokyo Tech Laboratory.",
            variables: {
                "--bg-color": "#0c0d12",
                "--text-color": "#ccff00",
                "--primary-color": "#ccff00",
                "--primary-container": "rgba(204, 255, 0, 0.15)",
                "--on-primary-container": "#ffffff",
                "--surface-color": "#161822",
                "--surface-container-low": "#0e1017",
                "--surface-container-lowest": "#050608",
                "--on-surface-variant": "#00e5ff",
                "--secondary": "#99cc00",
                "--radial-pattern": "radial-gradient(rgba(204, 255, 0, 0.2) 1.2px, transparent 1.2px)",
                "--electric-shadow-val": "0 15px 30px -5px rgba(204, 255, 0, 0.3)",
                "--electric-shadow-hover-val": "0 25px 40px -10px rgba(204, 255, 0, 0.6)",
                "--card-gradient": "linear-gradient(135deg, #00e5ff 0%, #ccff00 100%)",
                "--tab-glow": "0 0 14px rgba(204, 255, 0, 0.6)"
            }
        }
    };

    let activeSkin = localStorage.getItem('launchpad-skin') || 'emerald';

    function applySkin(skinKey) {
        const skin = skins[skinKey];
        let styleContent = ":root {\n";
        for (let [varName, varValue] of Object.entries(skin.variables)) {
            styleContent += `${varName}: ${varValue};\n`;
        }
        styleContent += "}";
        document.getElementById('skinStyles').innerHTML = styleContent;
        document.getElementById('logoTitle').innerText = skin.title;
        document.getElementById('footerTitle').innerHTML = `${skin.title} <span class="text-[14px] align-top opacity-50">v2.0</span>`;
        document.getElementById('footerCopyright').innerText = skin.copyright;
        localStorage.setItem('launchpad-skin', skinKey);

        // Actualizar checks visuales en el Dropdown
        Object.keys(skins).forEach(key => {
            const opt = document.getElementById(`opt-${key}`);
            if(opt) opt.querySelector('.dot').classList.toggle('hidden', key !== skinKey);
        });
    }

    function toggleSkinMenu(event) {
        event.stopPropagation();
        document.getElementById('skinDropdown').classList.toggle('show');
    }

    function selectSkin(skinKey) {
        activeSkin = skinKey;
        applySkin(skinKey);
        filterApps(); // Regenerar gradientes con la paleta activa
        document.getElementById('skinDropdown').classList.remove('show');
    }

    document.addEventListener('click', () => {
        document.getElementById('skinDropdown')?.classList.remove('show');
    });

    applySkin(activeSkin);

    // Sistema Core de Autenticación y Reglas de Permisos
    const credentials = {
        "4": { password: "", role: "admin", allowedApps: ["all"] },
        "luis": { password: "1967", role: "injusa_full", allowedApps: ["INJUSA 12W", "INJUSA CRM", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] },
        "ventas": { password: "injven", role: "injusa_sales", allowedApps: ["INJUSA 12W", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] }
    };

    const apps = [
        { name: "INJUSA 12W", url: "https://app-12-w.vercel.app/", icon: "bolt" },
        { name: "INJUSA CRM", url: "https://app-crm-injusa.vercel.app/", icon: "hub" },
        { name: "INJUSA VENTA PEQUEÑOS", url: "https://app-inventario-bice-tau.vercel.app/", icon: "inventory_2" },
        { name: "INJUSA EVO STOCK", url: "https://app-plan-stock.vercel.app/", icon: "package_2" },
        { name: "KOVA SONG ARCHIVE", url: "https://kova-song-archive.vercel.app/", icon: "album" },
        { name: "KOVA CONTENT OS", url: "https://kova-app-contenido.vercel.app/", icon: "video_library" },
        { name: "KOVA LEAD MANAGER", url: "https://kova-crm.vercel.app/", icon: "trending_up" }
    ];

    let currentUser = null;
    let currentTab = 'ALL';

    function handleLogin() {
        const username = document.getElementById('usernameInput').value.trim().toLowerCase();
        const password = document.getElementById('passwordInput').value.trim();
        const errorDiv = document.getElementById('loginError');

        if (credentials[username] && credentials[username].password === password) {
            errorDiv.classList.add('hidden');
            currentUser = credentials[username];
            currentUser.name = username;
            setupWorkspace();
        } else {
            errorDiv.classList.remove('hidden');
        }
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }

    function setupWorkspace() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = `SYS // ${currentUser.name}`;

        const dock = document.getElementById('navigationDock');
        if (currentUser.role === 'admin') {
            currentTab = 'ALL';
            dock.innerHTML = `
                <div onclick="switchTab('ALL')" id="tab-ALL" class="group flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-2xl p-3 scale-110 cursor-pointer shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-1 active:scale-95">
                    <span class="material-symbols-outlined">grid_view</span>
                    <span class="font-label-sm text-[9px] mt-1 font-bold uppercase">Todas</span>
                </div>
                <div onclick="switchTab('INJUSA')" id="tab-INJUSA" class="group flex flex-col items-center justify-center text-primary/60 p-3 hover:bg-primary/10 rounded-2xl hover:text-primary transition-all cursor-pointer duration-200 hover:-translate-y-1 active:scale-95">
                    <span class="material-symbols-outlined">factory</span>
                    <span class="font-label-sm text-[9px] mt-1 font-bold uppercase">Injusa</span>
                </div>
                <div onclick="switchTab('KOVA')" id="tab-KOVA" class="group flex flex-col items-center justify-center text-primary/60 p-3 hover:bg-primary/10 rounded-2xl hover:text-primary transition-all cursor-pointer duration-200 hover:-translate-y-1 active:scale-95">
                    <span class="material-symbols-outlined">album</span>
                    <span class="font-label-sm text-[9px] mt-1 font-bold uppercase">Kova</span>
                </div>
            `;
        } else {
            currentTab = 'INJUSA';
            dock.innerHTML = `
                <div class="group flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-2xl p-3 scale-110 shadow-lg pointer-events-none">
                    <span class="material-symbols-outlined">factory</span>
                    <span class="font-label-sm text-[9px] mt-1 font-bold uppercase">INJUSA PANEL</span>
                </div>
            `;
        }
        filterApps();
    }

    function switchTab(tab) {
        currentTab = tab;
        
        const tabs = ['ALL', 'INJUSA', 'KOVA'];
        tabs.forEach(t => {
            const btn = document.getElementById(`tab-${t}`);
            if (!btn) return;
            if (t === tab) {
                btn.className = "group flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-2xl p-3 scale-110 cursor-pointer shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-1 active:scale-95";
            } else {
                btn.className = "group flex flex-col items-center justify-center text-primary/60 p-3 hover:bg-primary/10 rounded-2xl hover:text-primary transition-all cursor-pointer duration-200 hover:-translate-y-1 active:scale-95";
            }
        });

        filterApps();
    }

    function syncAndFilter(inputSource) {
        document.getElementById('searchInput').value = inputSource.value;
        filterApps();
    }

    function filterApps() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const grid = document.getElementById('appGrid');
        const emptyState = document.getElementById('emptyState');
        
        const filtered = apps.filter(app => {
            const isAllowed = currentUser.role === 'admin' || currentUser.allowedApps.includes(app.name);
            const matchesTab = (currentTab === 'ALL') || app.name.toUpperCase().startsWith(currentTab);
            const matchesSearch = app.name.toLowerCase().includes(searchTerm);
            return isAllowed && matchesTab && matchesSearch;
        });

        grid.innerHTML = '';

        if (filtered.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            filtered.forEach(app => {
                let cleanName = app.name.replace(/^INJUSA\s+/i, '').replace(/^KOVA\s+/i, '');

                const appMarkup = `
                    <div onclick="window.open('${app.url}', '_blank')" class="group flex flex-col items-center gap-4 cursor-pointer">
                        <div class="w-full aspect-square bg-gradient-to-br from-[var(--primary-container)] to-[var(--primary-color)] rounded-2xl electric-shadow group-hover:electric-shadow-hover transition-all duration-300 group-hover:-translate-y-2 flex items-center justify-center overflow-hidden">
                            <span class="material-symbols-outlined text-6xl text-[var(--surface-color)] drop-shadow-lg" style="font-variation-settings: 'FILL' 1;">${app.icon}</span>
                        </div>
                        <span class="font-headline-lg-mobile text-[1.1rem] uppercase text-center tracking-tight font-black text-on-surface/80 group-hover:text-primary transition-colors max-w-full truncate">${cleanName}</span>
                    </div>
                `;
                grid.innerHTML += appMarkup;
            });
        }
    }

    // Vinculación de barra de búsqueda desktop -> móvil
    document.getElementById('searchInput').addEventListener('input', function() {
        document.getElementById('searchInputMobile').value = this.value;
    });

    // Control global de atajos de teclado
    document.addEventListener('keydown', (e) => {
        if (e.key === '/') {
            e.preventDefault();
            const visibleSearch = window.innerWidth >= 768 ? document.getElementById('searchInput') : document.getElementById('searchInputMobile');
            visibleSearch.focus();
        }
    });

    document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
