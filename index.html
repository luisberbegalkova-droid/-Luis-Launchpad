<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "primary": "#065f46", // Forest Green
                "surface": "rgba(236, 253, 245, 0.4)", // Mint Tint
                "on-surface": "#064e3b",
                "background": "#f0fdf4"
              },
              "fontFamily": {
                "display": ["Inter", "sans-serif"],
                "body": ["Inter", "sans-serif"]
              }
            },
          },
        }
    </script>
    <style>
        body {
            background: #f0fdf4;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            color: #064e3b;
        }

        /* Animated Mesh Gradient Background - Emerald Aurora Theme */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(at 0% 0%, #065f46 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #a7f3d0 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #34d399 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #ecfdf5 0px, transparent 50%);
            filter: blur(80px);
            opacity: 0.6;
            animation: mesh-move 25s ease infinite alternate;
        }

        @keyframes mesh-move {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) translate(1%, 1%); }
        }

        /* Frosted Glass Buttons - Emerald Variant */
        .glass-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(167, 243, 208, 0.5);
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(6, 95, 70, 0.1),
                        inset 0 0 20px rgba(255, 255, 255, 0.5);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 20px 40px rgba(6, 95, 70, 0.15),
                        0 0 30px rgba(16, 185, 129, 0.3);
            transform: translateY(-12px) scale(1.08);
            border: 1px solid rgba(52, 211, 153, 0.8);
        }

        /* Orbit Layout Logic */
        .orbit-container {
            position: relative;
            width: 850px;
            height: 850px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-item {
            position: absolute;
            animation: float 8s ease-in-out infinite;
            transition: transform 0.2s ease-out;
        }

        @keyframes float {
            0%, 100% { margin-top: 0px; }
            50% { margin-top: -20px; }
        }

        /* Icon Z-Levels */
        .z-low { animation-delay: 0.5s; z-index: 10; }
        .z-mid { animation-delay: -1.5s; z-index: 20; }
        .z-high { animation-delay: -3.5s; z-index: 30; }

        /* Elegant Thin Typography */
        .text-ultra-thin {
            font-weight: 200;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #064e3b;
        }

        /* Material Symbols Styling - Emerald Gradient */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
            font-size: 3rem;
            background: linear-gradient(135deg, #065f46 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glowing Crystal Search Bar - Lime/Emerald Aura */
        .glass-search {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(50px);
            border: 1px solid rgba(167, 243, 208, 0.4);
            box-shadow: 0 10px 40px rgba(6, 95, 70, 0.05);
        }

        .tab-btn-active {
            opacity: 1 !important;
            font-weight: 400;
            text-shadow: 0 0 12px rgba(6, 95, 70, 0.4);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
<div class="mesh-bg"></div>

<!-- PORTAL DE ACCESO CRISTALINO -->
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center px-4 backdrop-blur-md">
    <div class="glass-card w-full max-w-sm p-10 flex flex-col gap-8">
        <div class="text-center">
            <h1 class="text-ultra-thin text-2xl tracking-[0.4em] text-emerald-900">LAUNCHPAD</h1>
            <p class="text-[9px] text-emerald-800/50 mt-2 tracking-[0.3em] uppercase font-medium">Security Gate // Authorized Personnel</p>
        </div>
        
        <div class="flex flex-col gap-5">
            <div>
                <label class="block text-[10px] uppercase tracking-[0.2em] text-emerald-800 font-semibold mb-2">user_identity</label>
                <input id="usernameInput" type="text" class="w-full bg-white/20 border border-emerald-200/40 rounded-2xl px-4 py-3 outline-none focus:border-emerald-500/50 transition-all text-emerald-900 font-normal placeholder:text-emerald-900/20 text-sm tracking-widest" placeholder="USER ID">
            </div>
            <div>
                <label class="block text-[10px] uppercase tracking-[0.2em] text-emerald-800 font-semibold mb-2">access_pass</label>
                <input id="passwordInput" type="password" class="w-full bg-white/20 border border-emerald-200/40 rounded-2xl px-4 py-3 outline-none focus:border-emerald-500/50 transition-all text-emerald-900 font-normal placeholder:text-emerald-900/20 text-sm tracking-widest" placeholder="••••••••">
            </div>
            <div id="loginError" class="hidden text-[10px] text-red-700 tracking-wider font-semibold uppercase bg-red-100/40 border border-red-200/50 rounded-xl px-4 py-2.5 text-center">
                Acceso denegado. Revise las credenciales.
            </div>
        </div>

        <button onclick="handleLogin()" class="w-full glass-card hover:bg-white/40 text-emerald-900 text-xs font-semibold py-4 rounded-2xl uppercase tracking-[0.2em] transition-all">
            Verify_
        </button>
    </div>
</div>

<!-- CAPA PRINCIPAL DEL LAUNCHPAD -->
<div id="mainContent" class="hidden w-full h-full flex flex-col items-center justify-center">
    
    <!-- Top Bar -->
    <header class="fixed top-0 w-full px-12 py-8 flex justify-between items-center z-50">
        <div class="text-ultra-thin text-xl tracking-[0.5em] opacity-90">LaunchPad Aurora</div>
        <div class="flex items-center gap-6 text-[10px] tracking-widest font-medium text-emerald-800/60">
            <span id="userDisplay" class="uppercase text-emerald-900">IDENTITY: --</span>
            <span class="w-[1px] h-3 bg-emerald-800/20"></span>
            <span onclick="handleLogout()" class="cursor-pointer hover:text-red-700 transition-colors uppercase flex items-center gap-1 font-semibold">
                <span class="material-symbols-outlined !text-xs opacity-80" style="background:none;-webkit-text-fill-color:initial;color:inherit;">logout</span> Cerrar Sesión
            </span>
        </div>
    </header>

    <main class="relative flex items-center justify-center w-full min-h-screen">
        <!-- Search Bar (Central Sun) -->
        <div class="z-50 w-96 relative">
            <div class="glass-search p-1.5 rounded-full flex items-center pr-2 group transition-all duration-700 focus-within:w-[460px] focus-within:-ml-[32px]">
                <input id="searchInput" oninput="filterApps()" class="bg-transparent border-none focus:ring-0 text-ultra-thin text-center w-full placeholder:text-emerald-900/30 placeholder:tracking-[0.5em] text-sm" placeholder="DISCOVER..." type="text"/>
                <button class="w-10 h-10 rounded-full flex items-center justify-center glass-card hover:bg-emerald-50/40">
                    <span class="material-symbols-outlined !text-lg opacity-60">search</span>
                </button>
            </div>
        </div>

        <!-- Orbiting Icons Area -->
        <div id="appOrbitContainer" class="absolute orbit-container">
            <!-- Las apps se inyectan dinámicamente aquí -->
        </div>
    </main>

    <!-- Bottom Navigation Dock -->
    <nav class="fixed bottom-12 z-50">
        <div id="navigationDock" class="glass-card px-10 py-4 flex gap-12 items-center justify-center !rounded-full text-[10px] tracking-[0.3em] font-medium uppercase text-emerald-900/40">
            <!-- Pestañas dinámicas inyectadas -->
        </div>
    </nav>

    <footer class="fixed bottom-4 w-full text-center opacity-30 text-[9px] text-ultra-thin uppercase tracking-[0.6em] pointer-events-none">
        Launchpad Emerald Aurora // Frosted Glass OS v3.1
    </footer>
</div>

<script>
    // Configuración estructural de accesos y aplicaciones
    const credentials = {
        "4": { password: "", role: "admin", allowedApps: ["all"] },
        "luis": { password: "1967", role: "injusa_full", allowedApps: ["INJUSA 12W", "INJUSA CRM", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] },
        "ventas": { password: "injven", role: "injusa_sales", allowedApps: ["INJUSA 12W", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] }
    };

    const apps = [
        { name: "INJUSA 12W", url: "https://app-12-w.vercel.app/", icon: "bolt" },
        { name: "INJUSA CRM", url: "https://app-crm-injusa.vercel.app/", icon: "hub" },
        { name: "INJUSA VENTA PEQUEÑOS", url: "https://app-inventario-bice-tau.vercel.app/", icon: "inventory_2" },
        { name: "INJUSA EVO STOCK", url: "https://app-plan-stock.vercel.app/", icon: "package_2" },
        { name: "KOVA SONG ARCHIVE", url: "https://kova-song-archive.vercel.app/", icon: "album" },
        { name: "KOVA CONTENT OS", url: "https://kova-app-contenido.vercel.app/", icon: "video_library" },
        { name: "KOVA LEAD MANAGER", url: "https://kova-crm.vercel.app/", icon: "trending_up" }
    ];

    let currentUser = null;
    let currentTab = 'ALL';
    let mouseX = 0, mouseY = 0;

    function handleLogin() {
        const username = document.getElementById('usernameInput').value.trim().toLowerCase();
        const password = document.getElementById('passwordInput').value.trim();
        const errorDiv = document.getElementById('loginError');

        if (credentials[username] && credentials[username].password === password) {
            errorDiv.classList.add('hidden');
            currentUser = credentials[username];
            currentUser.name = username;
            setupWorkspace();
        } else {
            errorDiv.classList.remove('hidden');
        }
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }

    function setupWorkspace() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = `SYS // ${currentUser.name}`;

        const dock = document.getElementById('navigationDock');
        if (currentUser.role === 'admin') {
            currentTab = 'ALL';
            dock.innerHTML = `
                <span onclick="switchTab('ALL')" id="tab-ALL" class="cursor-pointer hover:text-emerald-900 transition-opacity tab-btn-active">TODAS</span>
                <span onclick="switchTab('INJUSA')" id="tab-INJUSA" class="cursor-pointer hover:text-emerald-900 transition-opacity">INJUSA</span>
                <span onclick="switchTab('KOVA')" id="tab-KOVA" class="cursor-pointer hover:text-emerald-900 transition-opacity">KOVA</span>
            `;
        } else {
            currentTab = 'INJUSA';
            dock.innerHTML = `
                <span id="tab-INJUSA" class="tab-btn-active opacity-100 tracking-[0.4em]">INJUSA PANEL</span>
            `;
        }
        filterApps();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-ALL')?.classList.toggle('tab-btn-active', tab === 'ALL');
        document.getElementById('tab-INJUSA')?.classList.toggle('tab-btn-active', tab === 'INJUSA');
        document.getElementById('tab-KOVA')?.classList.toggle('tab-btn-active', tab === 'KOVA');
        filterApps();
    }

    function filterApps() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const orbitContainer = document.getElementById('appOrbitContainer');
        
        const filtered = apps.filter(app => {
            const isAllowed = currentUser.role === 'admin' || currentUser.allowedApps.includes(app.name);
            const matchesTab = (currentTab === 'ALL') || app.name.toUpperCase().startsWith(currentTab);
            const matchesSearch = app.name.toLowerCase().includes(searchTerm);
            return matchesTab && matchesSearch;
        });

        orbitContainer.innerHTML = '';

        const totalItems = filtered.length;
        const radiusX = totalItems <= 3 ? 280 : 340; 
        const radiusY = totalItems <= 3 ? 230 : 270; 

        filtered.forEach((app, index) => {
            // Distribución angular equitativa en la elipse
            const angle = (index * (2 * Math.PI / totalItems)) - (Math.PI / 2);
            const posX = Math.cos(angle) * radiusX;
            const posY = Math.sin(angle) * radiusY;

            // Variación de niveles de profundidad
            const depthClasses = ['z-low', 'z-mid', 'z-high'];
            const depth = depthClasses[index % depthClasses.length];

            // Limpieza visual del prefijo corporativo
            let cleanName = app.name.replace(/^INJUSA\s+/i, '').replace(/^KOVA\s+/i, '');

            const appMarkup = `
                <div class="orbit-item ${depth} pointer-events-auto" 
                     data-depth-speed="${depth === 'z-high' ? 1.8 : (depth === 'z-mid' ? 1.2 : 0.6)}"
                     style="transform: translate(${posX}px, ${posY}px); left: calc(50% - 3.5rem); top: calc(50% - 3.5rem);">
                    <a class="group flex flex-col items-center gap-4" href="${app.url}" target="_blank">
                        <div class="glass-card w-24 h-24 flex items-center justify-center">
                            <span class="material-symbols-outlined" style="font-size: 2.8rem;">${app.icon}</span>
                        </div>
                        <span class="text-ultra-thin text-[9px] opacity-40 group-hover:opacity-100 tracking-widest text-center transition-opacity max-w-[120px] truncate">${cleanName}</span>
                    </a>
                </div>
            `;
            orbitContainer.innerHTML += appMarkup;
        });
        
        applyParallax();
    }

    function applyParallax() {
        document.querySelectorAll('.orbit-item').forEach(item => {
            const speed = parseFloat(item.getAttribute('data-depth-speed')) || 1;
            const currentTransform = item.style.transform.split(' translate')[0]; 
            item.style.transform = `${currentTransform} translate(${mouseX * speed}px, ${mouseY * speed}px)`;
        });
    }

    // Parallax activo según el cursor
    document.addEventListener('mousemove', (e) => {
        mouseX = (window.innerWidth / 2 - e.pageX) / 50;
        mouseY = (window.innerHeight / 2 - e.pageY) / 50;
        applyParallax();
    });

    // Control de sumisión mediante tecla Intro
    document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
