<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-surface-variant": "var(--on-surface-variant)",
                "primary-container": "var(--primary-container)",
                "on-primary-container": "var(--on-primary-container)",
                "background": "var(--bg-color)",
                "surface-container-low": "var(--surface-container-low)",
                "secondary": "var(--secondary)",
                "on-surface": "var(--text-color)",
                "surface": "var(--surface-color)",
                "primary": "var(--primary-color)",
                "surface-container-lowest": "var(--surface-container-lowest)"
              },
              spacing: {
                "unit": "8px",
                "container-max": "1280px",
                "gutter": "24px",
                "margin-desktop": "48px",
                "margin-mobile": "16px"
              },
              fontFamily: {
                "headline-lg": ["Anybody"],
                "label-sm": ["JetBrains Mono"],
                "body-md": ["Work Sans"],
                "headline-lg-mobile": ["Anybody"],
                "title-md": ["Work Sans"],
                "display-lg": ["Anybody"]
              }
            },
          },
        }
    </script>
    <style id="skinStyles">
        /* Control dinámico de paletas vía inyección CSS */
    </style>
    <style>
        .electric-shadow { box-shadow: var(--electric-shadow-val); }
        .electric-shadow-hover { box-shadow: var(--electric-shadow-hover-val); }
        
        .bg-pattern {
            background-color: var(--bg-color);
            background-image: var(--radial-pattern);
            background-size: 32px 32px;
            transition: background-color 0.6s ease;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 48;
        }
        
        .font-bubbly { font-family: 'Anybody', sans-serif; }
        
        /* Animación interactiva para las tarjetas estilo iOS */
        .app-card {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
        }
        .app-card:hover {
            transform: translateY(-8px) scale(1.04);
        }

        .dropdown-menu {
            transform: translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
        }
        .dropdown-menu.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col font-bubbly text-on-background select-none">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center px-4 bg-pattern backdrop-blur-md">
    <div class="w-full max-w-md bg-surface border-4 border-primary rounded-[2rem] p-10 flex flex-col gap-6 electric-shadow">
        <div class="text-center">
            <h1 class="text-3xl font-black tracking-tight text-primary uppercase">LAUNCHPAD</h1>
            <p class="font-label-sm text-[10px] opacity-60 mt-1 uppercase tracking-widest">GATEWAY // SECURITY VERIFICATION</p>
        </div>
        
        <div class="flex flex-col gap-4">
            <div>
                <label class="block font-label-sm text-xs uppercase tracking-wide text-primary font-bold mb-2">user_identity</label>
                <input id="usernameInput" type="text" class="w-full h-12 bg-surface-container-low border-2 border-primary/20 rounded-2xl px-6 font-label-sm focus:ring-4 focus:ring-primary/20 transition-all text-on-surface" placeholder="USER ID">
            </div>
            <div>
                <label class="block font-label-sm text-xs uppercase tracking-wide text-primary font-bold mb-2">access_key</label>
                <input id="passwordInput" type="password" class="w-full h-12 bg-surface-container-low border-2 border-primary/20 rounded-2xl px-6 font-label-sm focus:ring-4 focus:ring-primary/20 transition-all text-on-surface" placeholder="••••••••">
            </div>
            <div id="loginError" class="hidden font-label-sm text-[11px] text-red-600 font-bold uppercase bg-red-100 border-2 border-red-200 rounded-2xl px-4 py-3 text-center">
                Autenticación Errónea. Verifique terminal.
            </div>
        </div>

        <button onclick="handleLogin()" class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-sm uppercase rounded-2xl font-bold transition-all shadow-lg active:scale-95 hover:opacity-90">
            Initialize_
        </button>
    </div>
</div>

<div id="mainContent" class="hidden flex-grow flex flex-col">
    <nav class="w-full top-4 sticky bg-surface/80 backdrop-blur-md rounded-2xl mx-auto max-w-[calc(100%-2*theme(spacing.gutter))] border-none electric-shadow z-50">
        <div class="flex justify-between items-center px-gutter py-unit h-20">
            <div id="logoTitle" class="text-xl md:text-2xl font-black tracking-tight text-primary uppercase">
                LaunchPad
            </div>
            
            <div class="flex flex-1 max-w-md mx-8 relative items-center">
                <input id="searchInput" oninput="filterApps()" class="w-full h-12 rounded-2xl border-none bg-surface-container-low px-6 font-label-sm text-xs electric-shadow focus:ring-4 focus:ring-primary/20 transition-all text-on-surface placeholder:opacity-40" placeholder="EXPLORE SYSTEMS... ( PRESIONA '/' )" type="text"/>
                <span class="material-symbols-outlined absolute right-4 text-primary opacity-60">search</span>
            </div>
            
            <div class="flex items-center gap-4 relative">
                <div class="relative">
                    <button onclick="toggleSkinMenu(event)" class="cursor-pointer transition-all duration-200 hover:bg-primary-container/20 rounded-2xl p-2 flex items-center">
                        <span class="material-symbols-outlined block text-primary">palette</span>
                    </button>
                    <div id="skinDropdown" class="dropdown-menu absolute right-0 mt-4 w-60 bg-surface border-2 border-primary/20 rounded-2xl p-2 z-[60] flex flex-col gap-1 font-label-sm text-xs text-on-surface shadow-xl">
                        <button onclick="selectSkin('emerald')" id="opt-emerald" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Emerald Aurora</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('sunset')" id="opt-sunset" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Sunset Quartz</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('cyberpunk')" id="opt-cyberpunk" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Obsidian Neon</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('nordic')" id="opt-nordic" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Nordic Frost</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('velvet')" id="opt-velvet" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Midnight Velvet</span><span class="dot hidden">•</span></button>
                        <button onclick="selectSkin('tokyo')" id="opt-tokyo" class="w-full text-left px-4 py-2.5 rounded-xl hover:bg-primary/10 font-bold transition-colors flex items-center justify-between"><span>Tokyo Tech</span><span class="dot hidden">•</span></button>
                    </div>
                </div>

                <div id="userDisplay" class="hidden sm:block font-label-sm text-xs font-bold text-primary bg-primary-container/20 px-3 py-2 rounded-xl uppercase tracking-wider">SYS: --</div>
                
                <button onclick="handleLogout()" class="cursor-pointer transition-all duration-200 hover:bg-red-100 rounded-2xl p-2" title="Cerrar Sesión">
                    <span class="material-symbols-outlined block text-red-600">logout</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-margin-mobile md:px-margin-desktop py-16">
        <div id="appGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-10 gap-y-14 max-w-7xl mx-auto">
            </div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-32 text-primary/40 font-bold">
            <span class="material-symbols-outlined text-6xl mb-4">grid_off</span>
            <p class="uppercase tracking-widest text-sm">No applications matching requirements</p>
        </div>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 rounded-[2.5rem] bg-surface/90 backdrop-blur-xl border-none electric-shadow flex items-center gap-4 px-6 py-3 w-max z-50 transition-all">
        <div id="navigationDock" class="flex gap-3 items-center">
            </div>
    </nav>

    <footer class="w-full mt-auto bg-surface-container-lowest/30 backdrop-blur-sm border-t border-primary/5">
        <div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop py-8 w-full gap-4 text-xs">
            <div id="footerTitle" class="font-black text-primary/40 uppercase tracking-tight"></div>
            <div id="footerCopyright" class="font-label-sm text-[11px] text-on-surface-variant/40 font-bold uppercase tracking-tight"></div>
        </div>
    </footer>
</div>

<script>
    // Variables complejas de diseño para el motor multi-skin en Grid
    const skins = {
        emerald: {
            title: "LaunchPad Aurora",
            copyright: "© 2026 Emerald Aurora System // Frosted Glass OS",
            variables: {
                "--bg-color": "#f0fdf4",
                "--text-color": "#064e3b",
                "--primary-color": "#065f46",
                "--primary-container": "#a7f3d0",
                "--on-primary-container": "#042f22",
                "--surface-color": "#ffffff",
                "--surface-container-low": "#ecfdf5",
                "--surface-container-lowest": "#ffffff",
                "--on-surface-variant": "#3f4943",
                "--secondary": "#4b6355",
                "--radial-pattern": "radial-gradient(rgba(6, 95, 70, 0.12) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 35px -5px rgba(6, 95, 70, 0.12)",
                "--electric-shadow-hover-val": "0 25px 45px -10px rgba(6, 95, 70, 0.25)",
                "--card-gradient": "linear-gradient(135deg, #a7f3d0 0%, #34d399 100%)",
                "--tab-glow": "0 0 12px rgba(6, 95, 70, 0.2)"
            }
        },
        sunset: {
            title: "LaunchPad Crystal",
            copyright: "© 2026 Sunset Quartz Framework // Pop Suite",
            variables: {
                "--bg-color": "#fff5f2",
                "--text-color": "#6b4e71",
                "--primary-color": "#ff7e67",
                "--primary-container": "rgba(255, 240, 230, 0.9)",
                "--on-primary-container": "#4a2834",
                "--surface-color": "#ffffff",
                "--surface-container-low": "#fff0ea",
                "--surface-container-lowest": "#ffffff",
                "--on-surface-variant": "#6b4e71",
                "--secondary": "#8b5d6b",
                "--radial-pattern": "radial-gradient(rgba(255, 126, 103, 0.15) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 35px -5px rgba(255, 126, 103, 0.15)",
                "--electric-shadow-hover-val": "0 25px 45px -10px rgba(255, 126, 103, 0.35)",
                "--card-gradient": "linear-gradient(135deg, #ffb3a7 0%, #ff7e67 100%)",
                "--tab-glow": "0 0 12px rgba(255, 126, 103, 0.3)"
            }
        },
        cyberpunk: {
            title: "LaunchPad Obsidian",
            copyright: "© 2026 Cyberpunk Synth Terminal Engine",
            variables: {
                "--bg-color": "#06060b",
                "--text-color": "#00f2fe",
                "--primary-color": "#00f2fe",
                "--primary-container": "rgba(0, 242, 254, 0.15)",
                "--on-primary-container": "#ffffff",
                "--surface-color": "#11111f",
                "--surface-container-low": "#0b0b14",
                "--surface-container-lowest": "#000000",
                "--on-surface-variant": "#9b51e0",
                "--secondary": "#7b2cbf",
                "--radial-pattern": "radial-gradient(rgba(0, 242, 254, 0.2) 1.2px, transparent 1.2px)",
                "--electric-shadow-val": "0 15px 35px -5px rgba(0, 242, 254, 0.25)",
                "--electric-shadow-hover-val": "0 25px 45px -10px rgba(0, 242, 254, 0.5)",
                "--card-gradient": "linear-gradient(135deg, rgba(155,81,224,0.3) 0%, rgba(0,242,254,0.3) 100%)",
                "--tab-glow": "0 0 15px rgba(0, 242, 254, 0.5)"
            }
        },
        nordic: {
            title: "LaunchPad Frost",
            copyright: "© 2026 Nordic Matrix Spaces // Core",
            variables: {
                "--bg-color": "#f8fafc",
                "--text-color": "#334155",
                "--primary-color": "#475569",
                "--primary-container": "#e2e8f0",
                "--on-primary-container": "#0f172a",
                "--surface-color": "#ffffff",
                "--surface-container-low": "#f1f5f9",
                "--surface-container-lowest": "#ffffff",
                "--on-surface-variant": "#64748b",
                "--secondary": "#475569",
                "--radial-pattern": "radial-gradient(rgba(71, 85, 105, 0.1) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 35px -5px rgba(71, 85, 105, 0.06)",
                "--electric-shadow-hover-val": "0 25px 45px -10px rgba(71, 85, 105, 0.18)",
                "--card-gradient": "linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%)",
                "--tab-glow": "0 0 10px rgba(71, 85, 105, 0.15)"
            }
        },
        velvet: {
            title: "LaunchPad Velvet",
            copyright: "© 2026 Midnight Lounge Suite Architecture",
            variables: {
                "--bg-color": "#060310",
                "--text-color": "#e0aaff",
                "--primary-color": "#7b2cbf",
                "--primary-container": "rgba(123, 44, 191, 0.2)",
                "--on-primary-container": "#ffffff",
                "--surface-color": "#110b21",
                "--surface-container-low": "#080414",
                "--surface-container-lowest": "#020106",
                "--on-surface-variant": "#ff9e00",
                "--secondary": "#9d4edd",
                "--radial-pattern": "radial-gradient(rgba(123, 44, 191, 0.25) 1.5px, transparent 1.5px)",
                "--electric-shadow-val": "0 15px 35px -5px rgba(123, 44, 191, 0.35)",
                "--electric-shadow-hover-val": "0 25px 45px -10px rgba(123, 44, 191, 0.6)",
                "--card-gradient": "linear-gradient(135deg, rgba(255,158,0,0.2) 0%, rgba(123,44,191,0.2) 100%)",
                "--tab-glow": "0 0 12px rgba(123, 44, 191, 0.5)"
            }
        },
        tokyo: {
            title: "LaunchPad Tokyo",
            copyright: "© 2026 Tokyo Tech Lab // Acid Grid",
            variables: {
                "--bg-color": "#0a0b10",
                "--text-color": "#ccff00",
                "--primary-color": "#ccff00",
                "--primary-container": "rgba(204, 255, 0, 0.12)",
                "--on-primary-container": "#ffffff",
                "--surface-color": "#141620",
                "--surface-container-low": "#0b0c13",
                "--surface-container-lowest": "#030406",
                "--on-surface-variant": "#00e5ff",
                "--secondary": "#99cc00",
                "--radial-pattern": "radial-gradient(rgba(204, 255, 0, 0.15) 1.2px, transparent 1.2px)",
                "--electric-shadow-val": "0 15px 35px -5px rgba(204, 255, 0, 0.25)",
                "--electric-shadow-hover-val": "0 25px 45px -10px rgba(204, 255, 0, 0.55)",
                "--card-gradient": "linear-gradient(135deg, rgba(0,229,255,0.2) 0%, rgba(204,255,0,0.2) 100%)",
                "--tab-glow": "0 0 14px rgba(204, 255, 0, 0.5)"
            }
        }
    };

    let activeSkin = localStorage.getItem('launchpad-skin') || 'emerald';

    function applySkin(skinKey) {
        const skin = skins[skinKey];
        let styleContent = ":root {\n";
        for (let [varName, varValue] of Object.entries(skin.variables)) {
            styleContent += `${varName}: ${varValue};\n`;
        }
        styleContent += "}";
        document.getElementById('skinStyles').innerHTML = styleContent;
        document.getElementById('logoTitle').innerText = skin.title;
        document.getElementById('footerTitle').innerHTML = `${skin.title} <span class="text-[12px] align-top opacity-30">v3.5</span>`;
        document.getElementById('footerCopyright').innerText = skin.copyright;
        localStorage.setItem('launchpad-skin', skinKey);

        Object.keys(skins).forEach(key => {
            const opt = document.getElementById(`opt-${key}`);
            if(opt) opt.querySelector('.dot').classList.toggle('hidden', key !== skinKey);
        });
    }

    function toggleSkinMenu(event) {
        event.stopPropagation();
        document.getElementById('skinDropdown').classList.toggle('show');
    }

    function selectSkin(skinKey) {
        activeSkin = skinKey;
        applySkin(skinKey);
        filterApps();
        document.getElementById('skinDropdown').classList.remove('show');
    }

    document.addEventListener('click', () => {
        document.getElementById('skinDropdown')?.classList.remove('show');
    });

    applySkin(activeSkin);

    // Repositorio de Credenciales y Control Operativo de Permisos
    const credentials = {
        "4": { password: "", role: "admin", allowedApps: ["all"] },
        "luis": { password: "1967", role: "injusa_full", allowedApps: ["INJUSA 12W", "INJUSA CRM", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] },
        "ventas": { password: "injven", role: "injusa_sales", allowedApps: ["INJUSA 12W", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] }
    };

    const apps = [
        { name: "INJUSA 12W", url: "https://app-12-w.vercel.app/", icon: "bolt" },
        { name: "INJUSA CRM", url: "https://app-crm-injusa.vercel.app/", icon: "hub" },
        { name: "INJUSA VENTA PEQUEÑOS", url: "https://app-inventario-bice-tau.vercel.app/", icon: "inventory_2" },
        { name: "INJUSA EVO STOCK", url: "https://app-plan-stock.vercel.app/", icon: "package_2" },
        { name: "KOVA SONG ARCHIVE", url: "https://kova-song-archive.vercel.app/", icon: "album" },
        { name: "KOVA CONTENT OS", url: "https://kova-app-contenido.vercel.app/", icon: "video_library" },
        { name: "KOVA LEAD MANAGER", url: "https://kova-crm.vercel.app/", icon: "trending_up" }
    ];

    let currentUser = null;
    let currentTab = 'ALL';

    function handleLogin() {
        const username = document.getElementById('usernameInput').value.trim().toLowerCase();
        const password = document.getElementById('passwordInput').value.trim();
        const errorDiv = document.getElementById('loginError');

        if (credentials[username] && credentials[username].password === password) {
            errorDiv.classList.add('hidden');
            currentUser = credentials[username];
            currentUser.name = username;
            setupWorkspace();
        } else {
            errorDiv.classList.remove('hidden');
        }
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }

    function setupWorkspace() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = `SYS // ${currentUser.name}`;

        const dock = document.getElementById('navigationDock');
        if (currentUser.role === 'admin') {
            currentTab = 'ALL';
            dock.innerHTML = `
                <div onclick="switchTab('ALL')" id="tab-ALL" class="group flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-2xl px-5 py-2.5 scale-105 cursor-pointer shadow-lg transition-all duration-200 active:scale-95">
                    <span class="font-label-sm text-[11px] font-bold uppercase tracking-wider">Todas</span>
                </div>
                <div onclick="switchTab('INJUSA')" id="tab-INJUSA" class="group flex flex-col items-center justify-center text-primary/60 px-5 py-2.5 hover:bg-primary/10 rounded-2xl hover:text-primary transition-all cursor-pointer duration-200 active:scale-95">
                    <span class="font-label-sm text-[11px] font-bold uppercase tracking-wider">Injusa</span>
                </div>
                <div onclick="switchTab('KOVA')" id="tab-KOVA" class="group flex flex-col items-center justify-center text-primary/60 px-5 py-2.5 hover:bg-primary/10 rounded-2xl hover:text-primary transition-all cursor-pointer duration-200 active:scale-95">
                    <span class="font-label-sm text-[11px] font-bold uppercase tracking-wider">Kova</span>
                </div>
            `;
        } else {
            currentTab = 'INJUSA';
            dock.innerHTML = `
                <div class="group flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-2xl px-6 py-3 shadow-lg pointer-events-none">
                    <span class="font-label-sm text-[11px] font-bold uppercase tracking-wider">INJUSA SYSTEM WORKSPACE</span>
                </div>
            `;
        }
        filterApps();
    }

    function switchTab(tab) {
        currentTab = tab;
        const tabs = ['ALL', 'INJUSA', 'KOVA'];
        tabs.forEach(t => {
            const btn = document.getElementById(`tab-${t}`);
            if (!btn) return;
            if (t === tab) {
                btn.className = "group flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-2xl px-5 py-2.5 scale-105 cursor-pointer shadow-lg transition-all duration-200 active:scale-95";
            } else {
                btn.className = "group flex flex-col items-center justify-center text-primary/60 px-5 py-2.5 hover:bg-primary/10 rounded-2xl hover:text-primary transition-all cursor-pointer duration-200 active:scale-95";
            }
        });
        filterApps();
    }

    function filterApps() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const grid = document.getElementById('appGrid');
        const emptyState = document.getElementById('emptyState');
        
        const filtered = apps.filter(app => {
            const isAllowed = currentUser.role === 'admin' || currentUser.allowedApps.includes(app.name);
            const matchesTab = (currentTab === 'ALL') || app.name.toUpperCase().startsWith(currentTab);
            const matchesSearch = app.name.toLowerCase().includes(searchTerm);
            return isAllowed && matchesTab && matchesSearch;
        });

        grid.innerHTML = '';

        if (filtered.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            filtered.forEach(app => {
                let cleanName = app.name.replace(/^INJUSA\s+/i, '').replace(/^KOVA\s+/i, '');

                const appMarkup = `
                    <div onclick="window.open('${app.url}', '_blank')" class="group flex flex-col items-center gap-5 cursor-pointer text-center">
                        <div class="app-card w-full aspect-square bg-gradient-to-br from-[var(--surface-container-low)] to-[var(--surface-color)] border border-primary/10 rounded-[2.2rem] electric-shadow group-hover:electric-shadow-hover flex items-center justify-center overflow-hidden relative">
                            <div class="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-500" style="background: var(--card-gradient);"></div>
                            <span class="material-symbols-outlined text-5xl text-primary drop-shadow-sm group-hover:scale-110 transition-transform duration-300">${app.icon}</span>
                        </div>
                        <span class="font-headline-lg-mobile text-sm md:text-base uppercase tracking-tight font-extrabold text-on-surface/80 group-hover:text-primary transition-colors max-w-full truncate px-2">${cleanName}</span>
                    </div>
                `;
                grid.innerHTML += appMarkup;
            });
        }
    }

    // Atajo rápido: Foco en buscador con la tecla "/"
    document.addEventListener('keydown', (e) => {
        if (e.key === '/') {
            e.preventDefault();
            document.getElementById('searchInput').focus();
        }
    });

    document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
