<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .glass-surface {
            backdrop-filter: blur(40px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
        .squircle {
            border-radius: 22%;
        }
        .bg-gradient-mesh {
            background-color: #faf9fe;
            background-image: 
                radial-gradient(at 0% 0%, #d8e2ff 0px, transparent 50%),
                radial-gradient(at 100% 0%, #e2dfff 0px, transparent 50%),
                radial-gradient(at 100% 100%, #ffdad6 0px, transparent 50%),
                radial-gradient(at 0% 100%, #fefcff 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-gradient-mesh min-h-screen text-on-surface font-body-md overflow-x-hidden">

<header class="fixed top-0 left-0 right-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 shadow-lg shadow-black/5">
    <div class="flex justify-between items-center w-full px-margin-desktop py-4 max-w-container-max mx-auto">
        <div class="font-headline-md text-xl font-bold text-slate-800">My Vercel Launchpad</div>
        
        <div class="flex-1 max-w-xl mx-8">
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-outline text-lg text-slate-500">search</span>
                </div>
                <input class="w-full bg-white/20 backdrop-blur-md border border-white/30 rounded-full py-2 pl-11 pr-4 focus:ring-2 focus:ring-primary/30 outline-none transition-all" placeholder="Buscar aplicación..." type="text"/>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button class="p-2 hover:bg-white/20 transition-all rounded-lg"><span class="material-symbols-outlined text-slate-700">settings</span></button>
            <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-white text-xs font-bold">LB</div>
        </div>
    </div>
</header>

<main class="pt-32 pb-48 px-6 md:px-16 min-h-screen">
    <div class="max-w-container-max mx-auto">
        <!-- App Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-x-12 gap-y-16 items-center justify-items-center">
            
            <!-- INJUSA 12W -->
            <a class="flex flex-col items-center gap-3 group transition-transform duration-300 hover:scale-110 active:scale-95" href="https://app-12-w.vercel.app/" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-blue-600" style="font-variation-settings: 'FILL' 1;">bolt</span>
                </div>
                <span class="font-medium text-sm text-slate-700">INJUSA 12W</span>
            </a>

            <!-- INJUSA CRM -->
            <a class="flex flex-col items-center gap-3 group transition-transform duration-300 hover:scale-110 active:scale-95" href="https://app-crm-injusa.vercel.app/" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-indigo-600" style="font-variation-settings: 'FILL' 1;">hub</span>
                </div>
                <span class="font-medium text-sm text-slate-700">INJUSA CRM</span>
            </a>

            <!-- INJUSA VENTA PEQUEÑOS -->
            <a class="flex flex-col items-center gap-3 group transition-transform duration-300 hover:scale-110 active:scale-95" href="https://app-inventario-bice-tau.vercel.app/" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-rose-600" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
                </div>
                <span class="font-medium text-sm text-slate-700 text-center">INJUSA Venta Pequeños</span>
            </a>

        </div>
    </div>
</main>

<!-- Dock -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-end gap-2 px-4 py-3 bg-white/20 backdrop-blur-2xl border border-white/30 shadow-2xl rounded-3xl mx-auto w-fit">
    <button class="p-3 hover:scale-125 transition-transform duration-300 ease-out"><span class="material-symbols-outlined text-3xl text-blue-500">folder</span></button>
    <button class="p-3 hover:scale-125 transition-transform duration-300 ease-out bg-white/30 rounded-xl shadow-inner"><span class="material-symbols-outlined text-3xl text-slate-800" style="font-variation-settings: 'FILL' 1;">apps</span></button>
    <div class="w-[1px] h-10 bg-black/10 mx-2"></div>
    <button class="p-3 hover:scale-125 transition-transform duration-300 ease-out"><span class="material-symbols-outlined text-3xl text-slate-600">terminal</span></button>
    <button class="p-3 hover:scale-125 transition-transform duration-300 ease-out"><span class="material-symbols-outlined text-3xl text-slate-600">language</span></button>
</nav>

</body>
</html>
