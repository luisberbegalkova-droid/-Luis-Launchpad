<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .glass-surface {
            backdrop-filter: blur(40px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
        .squircle { border-radius: 22%; }
        .bg-gradient-mesh {
            background-color: #faf9fe;
            background-image: 
                radial-gradient(at 0% 0%, #d8e2ff 0px, transparent 50%),
                radial-gradient(at 100% 0%, #e2dfff 0px, transparent 50%),
                radial-gradient(at 100% 100%, #ffdad6 0px, transparent 50%),
                radial-gradient(at 0% 100%, #fefcff 0px, transparent 50%);
        }
        .tab-active {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            color: #1e293b;
        }
        .hidden-grid { display: none; }
    </style>
</head>
<body class="bg-gradient-mesh min-h-screen text-on-surface font-body-md overflow-x-hidden">

<header class="fixed top-0 left-0 right-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 shadow-lg shadow-black/5">
    <div class="flex flex-col items-center w-full max-w-container-max mx-auto px-6 py-4">
        <div class="flex justify-between items-center w-full mb-4">
            <div class="font-headline-md text-xl font-bold text-slate-800">Launchpad</div>
            <div class="flex-1 max-w-xl mx-8">
                <div class="relative group">
                    <input class="w-full bg-white/20 backdrop-blur-md border border-white/30 rounded-full py-2 pl-11 pr-4 outline-none focus:ring-2 focus:ring-slate-300 transition-all" placeholder="Buscar..." type="text"/>
                    <span class="material-symbols-outlined absolute left-4 top-2.5 text-slate-500">search</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-white text-xs font-bold">LB</div>
            </div>
        </div>

        <!-- TABS SELECTOR -->
        <div class="flex gap-2 p-1 bg-black/5 rounded-2xl backdrop-blur-md w-fit">
            <button onclick="switchTab('injusa')" id="btn-injusa" class="px-6 py-1.5 rounded-xl text-sm font-semibold transition-all duration-300 tab-active">
                INJUSA
            </button>
            <button onclick="switchTab('kova')" id="btn-kova" class="px-6 py-1.5 rounded-xl text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all duration-300">
                KOVA STUDIO
            </button>
        </div>
    </div>
</header>

<main class="pt-48 pb-48 px-6 md:px-16 min-h-screen">
    <div class="max-w-container-max mx-auto">
        
        <!-- GRID INJUSA -->
        <div id="grid-injusa" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-x-12 gap-y-16 items-center justify-items-center transition-all duration-500">
            <a class="flex flex-col items-center gap-3 group transition-transform hover:scale-110" href="https://app-12-w.vercel.app/" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-blue-600">bolt</span>
                </div>
                <span class="font-medium text-sm text-slate-700">INJUSA 12W</span>
            </a>
            <a class="flex flex-col items-center gap-3 group transition-transform hover:scale-110" href="https://app-crm-injusa.vercel.app/" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-indigo-600">hub</span>
                </div>
                <span class="font-medium text-sm text-slate-700">INJUSA CRM</span>
            </a>
            <a class="flex flex-col items-center gap-3 group transition-transform hover:scale-110" href="https://app-inventario-bice-tau.vercel.app/" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-rose-600">inventory_2</span>
                </div>
                <span class="font-medium text-sm text-slate-700 text-center">Venta Pequeños</span>
            </a>
        </div>

        <!-- GRID KOVA (Oculto por defecto) -->
        <div id="grid-kova" class="hidden-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-x-12 gap-y-16 items-center justify-items-center transition-all duration-500">
            <a class="flex flex-col items-center gap-3 group transition-transform hover:scale-110" href="#" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-slate-800">graphic_eq</span>
                </div>
                <span class="font-medium text-sm text-slate-700">Mixing Desk</span>
            </a>
            <a class="flex flex-col items-center gap-3 group transition-transform hover:scale-110" href="#" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-slate-800">Queue_music</span>
                </div>
                <span class="font-medium text-sm text-slate-700 text-center">Mastering Flow</span>
            </a>
            <a class="flex flex-col items-center gap-3 group transition-transform hover:scale-110" href="#" target="_blank">
                <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                    <span class="material-symbols-outlined text-5xl text-slate-800">share</span>
                </div>
                <span class="font-medium text-sm text-slate-700">Content OS</span>
            </a>
        </div>

    </div>
</main>

<script>
    function switchTab(tab) {
        const gridInjusa = document.getElementById('grid-injusa');
        const gridKova = document.getElementById('grid-kova');
        const btnInjusa = document.getElementById('btn-injusa');
        const btnKova = document.getElementById('btn-kova');

        if (tab === 'injusa') {
            gridInjusa.classList.remove('hidden-grid');
            gridKova.classList.add('hidden-grid');
            btnInjusa.classList.add('tab-active');
            btnInjusa.classList.remove('text-slate-500');
            btnKova.classList.remove('tab-active');
            btnKova.classList.add('text-slate-500');
        } else {
            gridKova.classList.remove('hidden-grid');
            gridInjusa.classList.add('hidden-grid');
            btnKova.classList.add('tab-active');
            btnKova.classList.remove('text-slate-500');
            btnInjusa.classList.remove('tab-active');
            btnInjusa.classList.add('text-slate-500');
        }
    }
</script>

</body>
</html>
