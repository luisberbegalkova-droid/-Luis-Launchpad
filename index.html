<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .glass-surface {
            backdrop-filter: blur(40px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
        .squircle { border-radius: 22%; }
        .bg-gradient-mesh {
            background-color: #faf9fe;
            background-image: 
                radial-gradient(at 0% 0%, #d8e2ff 0px, transparent 50%),
                radial-gradient(at 100% 0%, #e2dfff 0px, transparent 50%),
                radial-gradient(at 100% 100%, #ffdad6 0px, transparent 50%),
                radial-gradient(at 0% 100%, #fefcff 0px, transparent 50%);
        }
        .tab-active {
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            color: #1e293b;
        }
    </style>
</head>
<body class="bg-gradient-mesh min-h-screen text-slate-800 font-sans overflow-x-hidden">

<header class="fixed top-0 left-0 right-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 shadow-sm">
    <div class="flex flex-col items-center w-full max-w-7xl mx-auto px-6 py-4">
        <div class="flex justify-between items-center w-full mb-6">
            <div class="text-xl font-bold tracking-tight text-slate-900">Launchpad</div>
            
            <div class="flex-1 max-w-md mx-8">
                <div class="relative group">
                    <input id="searchInput" oninput="filterApps()" class="w-full bg-white/30 backdrop-blur-md border border-white/40 rounded-full py-2 pl-11 pr-4 outline-none focus:ring-2 focus:ring-blue-400/30 transition-all placeholder:text-slate-500" placeholder="Buscar app..." type="text"/>
                    <span class="material-symbols-outlined absolute left-4 top-2.5 text-slate-500">search</span>
                </div>
            </div>

            <div class="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white text-xs font-bold">LB</div>
        </div>

        <div class="flex gap-1 p-1 bg-black/5 rounded-2xl backdrop-blur-md w-fit">
            <button onclick="setCurrentTab('INJUSA')" id="btn-INJUSA" class="px-8 py-2 rounded-xl text-sm font-bold transition-all duration-300 tab-active">
                INJUSA
            </button>
            <button onclick="setCurrentTab('KOVA')" id="btn-KOVA" class="px-8 py-2 rounded-xl text-sm font-bold text-slate-500 hover:text-slate-700 transition-all duration-300">
                KOVA
            </button>
        </div>
    </div>
</header>

<main class="pt-48 pb-20 px-6 md:px-16 min-h-screen">
    <div id="appGrid" class="max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-x-12 gap-y-16 items-start justify-items-center transition-opacity duration-300">
    </div>
    
    <div id="emptyState" class="hidden flex flex-col items-center justify-center pt-20 text-slate-400">
        <span class="material-symbols-outlined text-6xl mb-4">Inbox</span>
        <p>No hay aplicaciones en esta categoría todavía.</p>
    </div>
</main>

<script>
    const apps = [
        { 
            name: "INJUSA 12W", 
            url: "https://app-12-w.vercel.app/", 
            icon: "bolt", 
            color: "text-blue-600" 
        },
        { 
            name: "INJUSA CRM", 
            url: "https://app-crm-injusa.vercel.app/", 
            icon: "hub", 
            color: "text-indigo-600" 
        },
        { 
            name: "INJUSA VENTA PEQUEÑOS", 
            url: "https://app-inventario-bice-tau.vercel.app/", 
            icon: "inventory_2", 
            color: "text-rose-600" 
        },
        { 
            name: "KOVA SONG ARCHIVE", 
            url: "https://kova-song-archive.vercel.app/", 
            icon: "album", 
            color: "text-slate-900" 
        },
        { 
            name: "KOVA CONTENT OS", 
            url: "https://kova-app-contenido.vercel.app/", 
            icon: "movie_studio", 
            color: "text-slate-900" 
        }
    ];

    let currentTab = 'INJUSA';

    function setCurrentTab(tab) {
        currentTab = tab;
        document.getElementById('btn-INJUSA').classList.toggle('tab-active', tab === 'INJUSA');
        document.getElementById('btn-INJUSA').classList.toggle('text-slate-500', tab !== 'INJUSA');
        document.getElementById('btn-KOVA').classList.toggle('tab-active', tab === 'KOVA');
        document.getElementById('btn-KOVA').classList.toggle('text-slate-500', tab !== 'KOVA');
        filterApps();
    }

    function filterApps() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const grid = document.getElementById('appGrid');
        const emptyState = document.getElementById('emptyState');
        
        const filtered = apps.filter(app => {
            const matchesTab = app.name.toUpperCase().startsWith(currentTab);
            const matchesSearch = app.name.toLowerCase().includes(searchTerm);
            return matchesTab && matchesSearch;
        });

        grid.innerHTML = '';

        if (filtered.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            filtered.forEach(app => {
                const appElement = `
                    <a class="flex flex-col items-center gap-3 group transition-transform duration-300 hover:scale-110 active:scale-95 w-32" href="${app.url}" target="_blank">
                        <div class="squircle w-20 h-20 md:w-24 md:h-24 glass-surface flex items-center justify-center p-4">
                            <span class="material-symbols-outlined text-5xl ${app.color}" style="font-variation-settings: 'FILL' 1;">${app.icon}</span>
                        </div>
                        <span class="font-semibold text-xs md:text-sm text-slate-700 text-center leading-tight uppercase tracking-wide">${app.name.replace(currentTab + ' ', '')}</span>
                    </a>
                `;
                grid.innerHTML += appElement;
            });
        }
    }

    window.onload = filterApps;
</script>

</body>
</html>
