<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "primary": "#4f378a",
                "surface": "rgba(255, 255, 255, 0.1)",
                "on-surface": "#ffffff",
                "background": "#0a0514"
              },
              "fontFamily": {
                "display": ["Inter", "sans-serif"],
                "body": ["Inter", "sans-serif"]
              }
            },
          },
        }
    </script>
    <style>
        body {
            background: #0a0514;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            font-weight: 100;
        }

        /* Animated Mesh Gradient Background */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(at 0% 0%, #4f378a 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #765b00 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #93000a 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #1f1635 0px, transparent 50%);
            filter: blur(80px);
            opacity: 0.6;
            animation: mesh-move 20s ease infinite alternate;
        }

        @keyframes mesh-move {
            0% { transform: scale(1); }
            100% { transform: scale(1.2) translate(2%, 2%); }
        }

        /* Liquid Glass Buttons */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 40px rgba(130, 80, 255, 0.4),
                        0 20px 50px rgba(0, 0, 0, 0.5);
            transform: translateY(-10px) scale(1.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Orbit Layout Logic */
        .orbit-container {
            position: relative;
            width: 850px;
            height: 850px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-item {
            position: absolute;
            animation: float 6s ease-in-out infinite;
            transition: transform 0.2s ease-out;
        }

        @keyframes float {
            0%, 100% { margin-top: 0px; }
            50% { margin-top: -15px; }
        }

        /* Icon Z-Levels para emular profundidad espacial */
        .z-low { animation-delay: 0s; z-index: 10; }
        .z-mid { animation-delay: -2s; z-index: 20; }
        .z-high { animation-delay: -4s; z-index: 30; }

        /* Elegant Thin Typography */
        .text-ultra-thin {
            font-weight: 100;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Material Symbols Styling */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 100, 'GRAD' 0, 'opsz' 48;
            font-size: 3rem;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glowing Search Bar */
        .glass-search {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .tab-btn-active {
            opacity: 1 !important;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white">
<div class="mesh-bg"></div>

<!-- PANTALLA DE LOGIN NEURAL -->
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center px-4 backdrop-blur-md">
    <div class="glass-card w-full max-w-sm p-10 flex flex-col gap-8">
        <div class="text-center">
            <h1 class="text-ultra-thin text-3xl tracking-[0.3em] text-white">LAUNCHPAD</h1>
            <p class="text-[9px] text-white/40 mt-2 tracking-[0.4em] uppercase">Security Gate // System Access</p>
        </div>
        
        <div class="flex flex-col gap-5">
            <div>
                <label class="block text-[10px] uppercase tracking-[0.2em] text-white/60 mb-2">identity_user</label>
                <input id="usernameInput" type="text" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-white/30 transition-all text-white font-light placeholder:text-white/10 text-sm tracking-widest" placeholder="USER ID">
            </div>
            <div>
                <label class="block text-[10px] uppercase tracking-[0.2em] text-white/60 mb-2">access_key</label>
                <input id="passwordInput" type="password" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-white/30 transition-all text-white font-light placeholder:text-white/10 text-sm tracking-widest" placeholder="••••••••">
            </div>
            <div id="loginError" class="hidden text-[10px] text-red-400 tracking-wider uppercase bg-red-950/20 border border-red-900/30 rounded-xl px-4 py-2.5 text-center">
                Autenticación Fallida. Reintente.
            </div>
        </div>

        <button onclick="handleLogin()" class="w-full glass-card hover:bg-white/10 text-white text-xs font-semibold py-4 rounded-2xl uppercase tracking-[0.2em] transition-all">
            Initialize_
        </button>
    </div>
</div>

<!-- CAPA INTERNA DEL LAUNCHPAD -->
<div id="mainContent" class="hidden w-full h-full flex flex-col items-center justify-center">
    
    <!-- Top Bar -->
    <header class="fixed top-0 w-full px-12 py-8 flex justify-between items-center z-50">
        <div class="text-ultra-thin text-2xl tracking-[0.4em] opacity-80">LaunchPad</div>
        <div class="flex items-center gap-6 text-xs tracking-[0.3em] text-white/60">
            <span id="userDisplay" class="uppercase text-white/90">USER: --</span>
            <span class="w-[1px] h-4 bg-white/10"></span>
            <span onclick="handleLogout()" class="cursor-pointer hover:text-red-400 transition-colors uppercase flex items-center gap-1">
                <span class="material-symbols-outlined !text-xs opacity-80">logout</span> Exit
            </span>
        </div>
    </header>

    <main class="relative flex items-center justify-center w-full min-h-screen">
        <!-- Search Bar (Central Sun) -->
        <div class="z-50 w-96 relative">
            <div class="glass-search p-1 rounded-full flex items-center pr-2 group transition-all duration-500 focus-within:w-[460px] focus-within:-ml-[32px]">
                <input id="searchInput" oninput="filterApps()" class="bg-transparent border-none focus:ring-0 text-ultra-thin text-center w-full placeholder:text-white/20 placeholder:tracking-[0.5em] text-sm" placeholder="DISCOVER..." type="text"/>
                <button class="w-10 h-10 rounded-full flex items-center justify-center glass-card hover:bg-white/20">
                    <span class="material-symbols-outlined !text-xl opacity-80">search</span>
                </button>
            </div>
        </div>

        <!-- Orbiting Icons Workspace -->
        <div id="appOrbitContainer" class="absolute orbit-container">
            <!-- Las apps se inyectan flotando matemáticamente en órbitas concéntricas -->
        </div>
    </main>

    <!-- Bottom Navigation (Liquid Bar + Tab Selector) -->
    <nav class="fixed bottom-12 z-50">
        <div id="navigationDock" class="glass-card px-8 py-4 flex gap-10 items-center justify-center text-[11px] tracking-[0.3em] uppercase text-white/40">
            <!-- Pestañas dinámicas inyectadas por JS -->
        </div>
    </nav>

    <footer class="fixed bottom-4 w-full text-center opacity-20 text-[10px] text-ultra-thin uppercase tracking-[0.5em] pointer-events-none">
        Liquid Glass OS v3.0 // Neural Link Active
    </footer>
</div>

<script>
    // Base de datos de credenciales integrada
    const credentials = {
        "4": { password: "", role: "admin", allowedApps: ["all"] },
        "luis": { password: "1967", role: "injusa_full", allowedApps: ["INJUSA 12W", "INJUSA CRM", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] },
        "ventas": { password: "injven", role: "injusa_sales", allowedApps: ["INJUSA 12W", "INJUSA VENTA PEQUEÑOS", "INJUSA EVO STOCK"] }
    };

    const apps = [
        { name: "INJUSA 12W", url: "https://app-12-w.vercel.app/", icon: "bolt" },
        { name: "INJUSA CRM", url: "https://app-crm-injusa.vercel.app/", icon: "hub" },
        { name: "INJUSA VENTA PEQUEÑOS", url: "https://app-inventario-bice-tau.vercel.app/", icon: "inventory_2" },
        { name: "INJUSA EVO STOCK", url: "https://app-plan-stock.vercel.app/", icon: "package_2" },
        { name: "KOVA SONG ARCHIVE", url: "https://kova-song-archive.vercel.app/", icon: "album" },
        { name: "KOVA CONTENT OS", url: "https://kova-app-contenido.vercel.app/", icon: "video_library" },
        { name: "KOVA LEAD MANAGER", url: "https://kova-crm.vercel.app/", icon: "trending_up" }
    ];

    let currentUser = null;
    let currentTab = 'ALL';
    let mouseX = 0, mouseY = 0;

    function handleLogin() {
        const username = document.getElementById('usernameInput').value.trim().toLowerCase();
        const password = document.getElementById('passwordInput').value.trim();
        const errorDiv = document.getElementById('loginError');

        if (credentials[username] && credentials[username].password === password) {
            errorDiv.classList.add('hidden');
            currentUser = credentials[username];
            currentUser.name = username;
            setupWorkspace();
        } else {
            errorDiv.classList.remove('hidden');
        }
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }

    function setupWorkspace() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = `CORE // ${currentUser.name}`;

        const dock = document.getElementById('navigationDock');
        if (currentUser.role === 'admin') {
            currentTab = 'ALL';
            dock.innerHTML = `
                <span onclick="switchTab('ALL')" id="tab-ALL" class="cursor-pointer hover:text-white transition-opacity tab-btn-active">TODAS</span>
                <span onclick="switchTab('INJUSA')" id="tab-INJUSA" class="cursor-pointer hover:text-white transition-opacity">INJUSA</span>
                <span onclick="switchTab('KOVA')" id="tab-KOVA" class="cursor-pointer hover:text-white transition-opacity">KOVA</span>
            `;
        } else {
            currentTab = 'INJUSA';
            dock.innerHTML = `
                <span id="tab-INJUSA" class="tab-btn-active opacity-100 tracking-[0.4em]">INJUSA METRICS</span>
            `;
        }
        filterApps();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-ALL')?.classList.toggle('tab-btn-active', tab === 'ALL');
        document.getElementById('tab-INJUSA')?.classList.toggle('tab-btn-active', tab === 'INJUSA');
        document.getElementById('tab-KOVA')?.classList.toggle('tab-btn-active', tab === 'KOVA');
        filterApps();
    }

    function filterApps() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const orbitContainer = document.getElementById('appOrbitContainer');
        
        const filtered = apps.filter(app => {
            const isAllowed = currentUser.role === 'admin' || currentUser.allowedApps.includes(app.name);
            const matchesTab = (currentTab === 'ALL') || app.name.toUpperCase().startsWith(currentTab);
            const matchesSearch = app.name.toLowerCase().includes(searchTerm);
            return isAllowed && matchesTab && matchesSearch;
        });

        orbitContainer.innerHTML = '';

        // Constantes geométricas para distribuir los elementos en la elipse orbital
        const totalItems = filtered.length;
        // Si hay pocas aplicaciones, ampliamos el radio para que luzca estético
        const radiusX = totalItems <= 3 ? 280 : 340; 
        const radiusY = totalItems <= 3 ? 240 : 280; 

        filtered.forEach((app, index) => {
            // Cálculo del ángulo distribuido equitativamente alrededor de la zona central (Sun)
            const angle = (index * (2 * Math.PI / totalItems)) - (Math.PI / 2);
            const posX = Math.cos(angle) * radiusX;
            const posY = Math.sin(angle) * radiusY;

            // Asignación de niveles de profundidad espacial e interpolación de retardos
            const depthClasses = ['z-low', 'z-mid', 'z-high'];
            const depth = depthClasses[index % depthClasses.length];

            // Limpieza del prefijo corporativo de los nombres para la tarjeta visual
            let cleanName = app.name.replace(/^INJUSA\s+/i, '').replace(/^KOVA\s+/i, '');

            const appMarkup = `
                <div class="orbit-item ${depth} pointer-events-auto" 
                     data-depth-speed="${depth === 'z-high' ? 1.6 : (depth === 'z-mid' ? 1.0 : 0.5)}"
                     style="transform: translate(${posX}px, ${posY}px); left: calc(50% - 3.5rem); top: calc(50% - 3.5rem);">
                    <a class="group flex flex-col items-center gap-3" href="${app.url}" target="_blank">
                        <div class="glass-card w-24 h-24 flex items-center justify-center">
                            <span class="material-symbols-outlined" style="font-size: 2.8rem;">${app.icon}</span>
                        </div>
                        <span class="text-ultra-thin text-[10px] opacity-40 group-hover:opacity-100 tracking-widest text-center transition-opacity max-w-[120px] truncate">${cleanName}</span>
                    </a>
                </div>
            `;
            orbitContainer.innerHTML += appMarkup;
        });
        
        // Forzar actualización inmediata del cálculo de parallax si el ratón ya se está moviendo
        applyParallax();
    }

    function applyParallax() {
        document.querySelectorAll('.orbit-item').forEach(item => {
            const speed = parseFloat(item.getAttribute('data-depth-speed')) || 1;
            // Combinar la posición base de la órbita estática calculada con el desplazamiento sutil del ratón
            const currentTransform = item.style.transform.split(' translate')[0]; 
            item.style.transform = `${currentTransform} translate(${mouseX * speed}px, ${mouseY * speed}px)`;
        });
    }

    // Manejo global del efecto Parallax interactivo del ratón
    document.addEventListener('mousemove', (e) => {
        mouseX = (window.innerWidth / 2 - e.pageX) / 45;
        mouseY = (window.innerHeight / 2 - e.pageY) / 45;
        applyParallax();
    });

    // Gestión de inputs mediante eventos de teclado
    document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
