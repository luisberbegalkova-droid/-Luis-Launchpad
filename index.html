<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              fontFamily: {
                display: ["Inter", "sans-serif"],
                body: ["Inter", "sans-serif"]
              }
            },
          },
        }
    </script>
    <style id="skinStyles">
        /* Las variables dinámicas CSS se inyectan a través de JavaScript al cambiar de Skin */
    </style>
    <style>
        body {
            background: var(--bg-color);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            color: var(--text-color);
            transition: background 0.8s ease, color 0.8s ease;
        }

        /* Animated Mesh Gradient Background */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: var(--mesh-gradient);
            filter: blur(80px);
            opacity: var(--mesh-opacity);
            animation: mesh-move 25s ease infinite alternate;
            transition: background 0.8s ease, opacity 0.8s ease;
        }

        @keyframes mesh-move {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) translate(1%, 1%); }
        }

        /* Frosted Glass Buttons */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(170%);
            -webkit-backdrop-filter: blur(20px) saturate(170%);
            border: 1px solid var(--card-border);
            border-radius: 2rem;
            box-shadow: var(--card-shadow), inset 0 0 20px var(--card-inset);
            transition: background 0.5s ease, border 0.5s ease, transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.6s ease;
        }

        .glass-card:hover {
            background: var(--card-bg-hover);
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-12px) scale(1.08);
            border: 1px solid var(--card-border-hover);
        }

        /* Orbit Layout Logic */
        .orbit-container {
            position: relative;
            width: 850px;
            height: 850px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-item {
            position: absolute;
            animation: float 8s ease-in-out infinite;
            transition: transform 0.2s ease-out;
        }

        @keyframes float {
            0%, 100% { margin-top: 0px; }
            50% { margin-top: -20px; }
        }

        /* Depth Layers */
        .z-low { animation-delay: 0.5s; z-index: 10; }
        .z-mid { animation-delay: -1.5s; z-index: 20; }
        .z-high { animation-delay: -3.5s; z-index: 30; }

        .text-ultra-thin {
            font-weight: 200;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-color);
            transition: color 0.8s ease;
        }

        /* Material Symbols Gradient Text */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
            font-size: 3rem;
            background: var(--icon-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glowing Central Search Bar */
        .glass-search {
            background: var(--search-bg);
            backdrop-filter: blur(50px);
            border: 1px solid var(--search-border);
            box-shadow: var(--search-shadow);
            transition: background 0.8s ease, border 0.8s ease, w 0.5s ease, margin 0.5s ease;
        }

        .tab-btn-active {
            opacity: 1 !important;
            font-weight: 400;
            text-shadow: var(--tab-glow);
        }

        /* Custom Transition for Dropdown Menus */
        .dropdown-menu {
            transform: translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
        }
        .dropdown-menu.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

            currentUser = credentials[username];
            currentUser.name = username;

        } else {

            `;
        } else {
            currentTab = 'INJUSA';
            dock.innerHTML = `
                <span id="tab-INJUSA" class="tab-btn-active opacity-100 tracking-[0.4em]">INJUSA PANEL</span>
            `;
        }
        filterApps();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-ALL')?.classList.toggle('tab-btn-active', tab === 'ALL');
        document.getElementById('tab-INJUSA')?.classList.toggle('tab-btn-active', tab === 'INJUSA');
        document.getElementById('tab-KOVA')?.classList.toggle('tab-btn-active', tab === 'KOVA');
        filterApps();
    }

    function filterApps() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const orbitContainer = document.getElementById('appOrbitContainer');
        
        const filtered = apps.filter(app => {
            const isAllowed = currentUser.role === 'admin' || currentUser.allowedApps.includes(app.name);
            const matchesTab = (currentTab === 'ALL') || app.name.toUpperCase().startsWith(currentTab);
            const matchesSearch = app.name.toLowerCase().includes(searchTerm);
            return matchesTab && matchesSearch;
        });

        orbitContainer.innerHTML = '';

        const totalItems = filtered.length;
        const radiusX = totalItems <= 3 ? 280 : 340; 
        const radiusY = totalItems <= 3 ? 230 : 270; 

        filtered.forEach((app, index) => {
            const angle = (index * (2 * Math.PI / totalItems)) - (Math.PI / 2);
            const posX = Math.cos(angle) * radiusX;
            const posY = Math.sin(angle) * radiusY;

            const depthClasses = ['z-low', 'z-mid', 'z-high'];
            const depth = depthClasses[index % depthClasses.length];

            let cleanName = app.name.replace(/^INJUSA\s+/i, '').replace(/^KOVA\s+/i, '');

            const appMarkup = `
                <div class="orbit-item ${depth} pointer-events-auto" 
                     data-depth-speed="${depth === 'z-high' ? 1.8 : (depth === 'z-mid' ? 1.2 : 0.6)}"
                     style="transform: translate(${posX}px, ${posY}px); left: calc(50% - 3.5rem); top: calc(50% - 3.5rem);">
                    <a class="group flex flex-col items-center gap-4" href="${app.url}" target="_blank">
                        <div class="glass-card w-24 h-24 flex items-center justify-center">
                            <span class="material-symbols-outlined" style="font-size: 2.8rem;">${app.icon}</span>
                        </div>
                        <span class="text-ultra-thin text-[9px] opacity-40 group-hover:opacity-100 tracking-widest text-center transition-opacity max-w-[120px] truncate" style="color: inherit;">${cleanName}</span>
                    </a>
                </div>
            `;
            orbitContainer.innerHTML += appMarkup;
        });
        
        applyParallax();
    }

    function applyParallax() {
        document.querySelectorAll('.orbit-item').forEach(item => {
            const speed = parseFloat(item.getAttribute('data-depth-speed')) || 1;
            const currentTransform = item.style.transform.split(' translate')[0]; 
            item.style.transform = `${currentTransform} translate(${mouseX * speed}px, ${mouseY * speed}px)`;
        });
    }

    document.addEventListener('mousemove', (e) => {
        mouseX = (window.innerWidth / 2 - e.pageX) / 50;
        mouseY = (window.innerHeight / 2 - e.pageY) / 50;
        applyParallax();
    });

    document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
