<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              fontFamily: {
                display: ["Inter", "sans-serif"],
                body: ["Inter", "sans-serif"]
              }
            },
          },
        }
    </script>
    <style id="skinStyles">
        /* Las variables dinámicas CSS se inyectan a través de JavaScript al cambiar de Skin */
    </style>
    <style>
        body {
            background: var(--bg-color);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            color: var(--text-color);
            transition: background 0.8s ease, color 0.8s ease;
        }

        /* Animated Mesh Gradient Background */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: var(--mesh-gradient);
            filter: blur(80px);
            opacity: var(--mesh-opacity);
            animation: mesh-move 25s ease infinite alternate;
            transition: background 0.8s ease, opacity 0.8s ease;
        }

        @keyframes mesh-move {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) translate(1%, 1%); }
        }

        /* Frosted Glass Buttons */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(170%);
            -webkit-backdrop-filter: blur(20px) saturate(170%);
            border: 1px solid var(--card-border);
            border-radius: 2rem;
            box-shadow: var(--card-shadow), inset 0 0 20px var(--card-inset);
            transition: background 0.5s ease, border 0.5s ease, transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.5s ease;
        }

        /* Efecto flotación individual adaptado al Grid lineal */
        .app-item-wrapper {
            animation: float 8s ease-in-out infinite;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .app-item-wrapper:hover {
            transform: translateY(-12px) scale(1.05) !important;
        }

        @keyframes float {
            0%, 100% { margin-top: 0px; }
            50% { margin-top: -15px; }
        }

        /* Depth Layers */
        .z-low { animation-delay: 0s; }
        .z-mid { animation-delay: -2.5s; }
        .z-high { animation-delay: -5s; }

        .text-ultra-thin {
            font-weight: 200;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-color);
            transition: color 0.8s ease;
        }

        /* Material Symbols Gradient Text */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
            font-size: 3rem;
            background: var(--icon-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glowing Central Search Bar */
        .glass-search {
            background: var(--search-bg);
            backdrop-filter: blur(50px);
            border: 1px solid var(--search-border);
            box-shadow: var(--search-shadow);
            transition: background 0.8s ease, border 0.8s ease, width 0.4s ease;
        }

        .tab-btn-active {
            opacity: 1 !important;
            font-weight: 400;
            text-shadow: var(--tab-glow);
        }

        /* Control de despliegue de menús */
        .dropdown-menu {
            transform: translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
        }
        .dropdown-menu.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

        for (let [varName, varValue] of Object.entries(skin.variables)) {
            styleContent += `${varName}: ${varValue};\n`;
        }
        styleContent += "}";
        document.getElementById('skinStyles').innerHTML = styleContent;
        document.getElementById('logoTitle').innerText = skin.title;
        document.getElementById('footerText').innerText = skin.footer;
        localStorage.setItem('launchpad-skin', skinKey);

        Object.keys(skins).forEach(key => {
            const opt = document.getElementById(`opt-${key}`);
            if(opt) opt.querySelector('.dot').classList.toggle('hidden', key !== skinKey);
        });
    }

    function toggleSkinMenu(event) {
        event.stopPropagation();
        document.getElementById('skinDropdown').classList.toggle('show');
    }

    function selectSkin(skinKey) {
        activeSkin = skinKey;
        applySkin(skinKey);
        filterApps();
        document.getElementById('skinDropdown').classList.remove('show');

    let currentUser = null;
    let currentTab = 'ALL';
    let mouseX = 0, mouseY = 0;

    function handleLogin() {
        const username = document.getElementById('usernameInput').value.trim().toLowerCase();
        const password = document.getElementById('passwordInput').value.trim();
        const errorDiv = document.getElementById('loginError');

        if (credentials[username] && credentials[username].password === password) {
            errorDiv.classList.add('hidden');
            currentUser = credentials[username];
            currentUser.name = username;
            setupWorkspace();
        } else {
            errorDiv.classList.remove('hidden');
        }
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }

    function setupWorkspace() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = `SYS // ${currentUser.name}`;

        const dock = document.getElementById('navigationDock');
        if (currentUser.role === 'admin') {
            currentTab = 'ALL';
            dock.innerHTML = `
                <span onclick="switchTab('ALL')" id="tab-ALL" class="cursor-pointer hover:opacity-100 opacity-40 transition-opacity tab-btn-active">TODAS</span>

            currentTab = 'INJUSA';
            dock.innerHTML = `

        currentTab = tab;
        document.getElementById('tab-ALL')?.classList.toggle('tab-btn-active', tab === 'ALL');
        document.getElementById('tab-INJUSA')?.classList.toggle('tab-btn-active', tab === 'INJUSA');
        document.getElementById('tab-KOVA')?.classList.toggle('tab-btn-active', tab === 'KOVA');
        filterApps();
    }

    function syncAndFilter(mobileInput) {
        document.getElementById('searchInput').value = mobileInput.value;
        filterApps();
    }

    function filterApps() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const gridContainer = document.getElementById('appContainerGrid');
        const emptyState = document.getElementById('emptyState');
        
        const filtered = apps.filter(app => {
            const isAllowed = currentUser.role === 'admin' || currentUser.allowedApps.includes(app.name);
            const matchesTab = (currentTab === 'ALL') || app.name.toUpperCase().startsWith(currentTab);
            const matchesSearch = app.name.toLowerCase().includes(searchTerm);
            return isAllowed && matchesTab && matchesSearch;
        });

        gridContainer.innerHTML = '';

        if (filtered.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            filtered.forEach((app, index) => {
                const layers = ['z-low', 'z-mid', 'z-high'];
                const currentLayer = layers[index % layers.length];
                const speedFactor = currentLayer === 'z-high' ? 1.4 : (currentLayer === 'z-mid' ? 0.9 : 0.4);

                let cleanName = app.name.replace(/^INJUSA\s+/i, '').replace(/^KOVA\s+/i, '');

                const appMarkup = `
                    <div class="app-item-wrapper ${currentLayer} w-28 flex flex-col items-center" data-parallax-speed="${speedFactor}">
                        <a class="group flex flex-col items-center gap-4 w-full" href="${app.url}" target="_blank">
                            <div class="glass-card w-24 h-24 flex items-center justify-center">
                                <span class="material-symbols-outlined" style="font-size: 2.8rem;">${app.icon}</span>
                            </div>
                            <span class="text-ultra-thin text-[11px] md:text-[12px] opacity-50 group-hover:opacity-100 tracking-[0.18em] font-normal text-center transition-opacity w-full truncate" style="color: inherit;">${cleanName}</span>
                        </a>
                    </div>
                `;
                gridContainer.innerHTML += appMarkup;
            });
        }
        applyParallax();
    }

    function applyParallax() {
        document.querySelectorAll('.app-item-wrapper').forEach(item => {
            const speed = parseFloat(item.getAttribute('data-parallax-speed')) || 1;
            item.style.transform = `translate(${mouseX * speed}px, ${mouseY * speed}px)`;
        });
    }

    document.addEventListener('mousemove', (e) => {
        mouseX = (window.innerWidth / 2 - e.pageX) / 55;
        mouseY = (window.innerHeight / 2 - e.pageY) / 55;
        applyParallax();
    });

    document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
